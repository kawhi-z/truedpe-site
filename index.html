<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TrueDPE · TrueDPE</title>
<style>
:root{--bg:#F6F6F3;--surface:#FFFFFF;--line:#E1E1DB;--ink:#14171A;--ink2:#50565C;--accent:#1D4ED8;--soft:#E6ECFB}
@media (prefers-color-scheme:dark){:root{--bg:#0F1214;--surface:#171B1F;--line:#2A3138;--ink:#F2F3F1;--ink2:#B3BAC0;--accent:#7EA2FF;--soft:#1B2540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
header{display:flex;align-items:center;gap:10px;margin-bottom:24px;font-weight:700;letter-spacing:.02em}
header .mark{width:28px;height:28px;border-radius:8px;background:#14171A;display:grid;place-items:center}
header nav{margin-left:auto;font-weight:500;font-size:15px;display:flex;gap:16px}
a{color:var(--accent)}
h1{font-size:30px;line-height:1.2;margin:0 0 12px}
h2{font-size:20px;margin:36px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
p,li{color:var(--ink)}
ul{padding-left:22px}
li{margin:6px 0}
.table{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:600}
tr:last-child td{border-bottom:0}
footer{margin-top:48px;color:var(--ink2);font-size:14px}
</style>
</head>
<body>
<main>
<header><span class="mark"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M1.5 10h15" stroke="#7EA2FF" stroke-width="1.4"/><path d="M5 9h3l1 1.4L10 9h3" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg></span><span>TrueDPE</span><nav><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></nav></header>
<h1>TrueDPE</h1>
<p>Practice the FAA Private Pilot oral exam with an AI examiner. Every grade cites the FAA source.</p>
<ul><li><a href="/privacy/">Privacy Policy</a></li><li><a href="/terms/">Terms of Use</a></li></ul>
<p>Contact: <a href="mailto:zhangdagen@xfrongchuang.com">zhangdagen@xfrongchuang.com</a></p>
<footer>TrueDPE · Checkride oral exam practice for student pilots</footer>
</main>
</body>
</html>
